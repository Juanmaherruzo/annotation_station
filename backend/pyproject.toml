[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotation-station"
version = "0.2.0"
description = "Local, privacy-first annotation platform powered by Segment Anything Model 2.1"
authors = [{ name = "Juan Manuel Herruzo", email = "juanmherruzo@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "sqlmodel>=0.0.19,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "opencv-python-headless>=4.9.0,<5.0.0",
    "numpy>=1.26.0,<3.0.0",
    "Pillow>=10.3.0,<12.0.0",
    "shapely>=2.0.4,<3.0.0",
    "PyYAML>=6.0,<7.0.0",
]

[project.optional-dependencies]
# Heavy ML backend. sam2 is not on PyPI — install from git (see README):
#   pip install git+https://github.com/facebookresearch/sam2.git
inference = [
    "torch>=2.3.0,<3.0.0",
    "torchvision>=0.18.0,<1.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "black>=24.0.0,<26.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "types-PyYAML>=6.0,<7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N naming, B bugbear (real bug
# patterns), C4 comprehensions, UP pyupgrade, RET returns, SIM simplify,
# RUF ruff-specific. B904 in particular catches `raise ... ` inside `except`
# without `from`, which loses the original traceback.
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "RET", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on private state and shadow names for readability.
"tests/*" = ["SIM117"]
# B008: `Depends(...)` and `File(...)` in defaults is FastAPI's required idiom,
# not an accidental mutable default.
# UP042: the str+Enum bases are what SQLModel stores as plain strings; moving to
# StrEnum would change the persisted representation.
"app/api/*" = ["B008"]
"app/db/models.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# numpy's current stubs use PEP 695 `type` statements that mypy only parses
# under python_version >= 3.12; skip following them (treated as Any, like cv2/torch/sam2).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
